version: 2

models:
  - name: gold_customer_summary
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']
      - name: gender
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'F', 'Other']

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['Verified', 'Pending', 'Expired', 'Rejected']

      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['Active', 'Inactive', 'Suspended', 'Closed']

      - name: registration_date
        tests:
          - not_null

      - name: risk_score
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100

      - name: age
        tests:
          - not_null
          - value_in_range:
              min_value: 18
              max_value: 120

      - name: age_bucket
        tests:
          - accepted_values:
              values: ['18-24', '25-34', '35-44', '45-54', '55-64', '65+']

      - name: tenure_months
        tests:
          - not_null
          - value_in_range:
              min_value: 0

      - name: risk_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['Low', 'Medium', 'High', 'Critical']

      - name: num_accounts
        tests:
          - not_null
          - value_in_range:
              min_value: 0

      - name: num_loans
        tests:
          - not_null
          - value_in_range:
              min_value: 0

      - name: num_products
        tests:
          - not_null
          - value_in_range:
              min_value: 0

  - name: gold_financial_summary
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: total_balance
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 5000000

      - name: fee_revenue
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 500000

      - name: interest_income
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 10000000

      - name: total_revenue
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 10000000

  - name: gold_transaction_summary
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('fact_accounts')
              field: account_id

      - name: transaction_date
        tests:
          - not_null

      - name: amount
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100000

      - name: fee_amount
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100000

      - name: type
        tests:
          - not_null
          - accepted_values:
              values: ['Deposit', 'Withdrawal', 'Transfer', 'Payment', 'Refund', 'Fee']

      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['Mobile', 'Web', 'ATM', 'Branch', 'POS']

      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['Completed', 'Pending', 'Failed', 'Reversed']

      - name: day_of_week
        tests:
          - not_null

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

  - name: gold_loan_summary
    columns:
      - name: loan_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: type
        tests:
          - accepted_values:
              values: ['Personal', 'Mortgage', 'Auto', 'Education', 'Business']

      - name: principal
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 1000000

      - name: outstanding_balance
        tests:
          - value_in_range:
              min_value: 0
              max_value: 1000000

      - name: interest_rate
        tests:
          - not_null

      - name: monthly_payment
        tests:
          - value_in_range:
              min_value: 0
              max_value: 100000

      - name: term_months
        tests:
          - not_null

      - name: start_date
        tests:
          - not_null

      - name: end_date
        tests:
          - not_null

      - name: status
        tests:
          - accepted_values:
              values: ['Current', 'Delinquent', 'Default', 'Paid Off']

      - name: days_past_due
        tests:
          - value_in_range:
              min_value: 0
              max_value: 365

      - name: dpd_bucket
        tests:
          - accepted_values:
              values: ['Current', '1-30', '31-60', '61-90', '90+']

  - name: gold_credit_summary

    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: credit_score
        tests:
          - not_null
          - value_in_range:
              min_value: 300
              max_value: 850

      - name: credit_score_bucket
        tests:
          - accepted_values:
              values: ['Poor', 'Fair', 'Good', 'Very Good', 'Exceptional']

      - name: utilization_pct
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100

      - name: utilization_bucket
        tests:
          - accepted_values:
              values: ['Very Low', 'Low', 'Moderate', 'High', 'Very High', 'Maxed']

      - name: total_limit
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 5000000

      - name: total_used
        tests:
          - value_in_range:
              min_value: 0
              max_value: 5000000

      - name: late_payments_12m
        tests:
          - value_in_range:
              min_value: 0

      - name: inquiries_6m
        tests:
          - value_in_range:
              min_value: 0

  - name: gold_digital_summary
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: age
        tests:
          - not_null
          - value_in_range:
              min_value: 18
              max_value: 120

      - name: age_bucket
        tests:
          - accepted_values:
              values: ['18-24', '25-34', '35-44', '45-54', '55-64', '65+']

      - name: days_since_last_login
        tests:
          - value_in_range:
              min_value: 0

      - name: preferred_channel
        tests:
          - not_null
          - accepted_values:
              values: ['Mobile', 'Web', 'ATM', 'Branch', 'Call center']

      - name: avg_monthly_logins
        tests:
          - value_in_range:
              min_value: 0

  - name: gold_product_summary
    columns:
      - name: account_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Premium', 'Private Banking', 'SME']

      - name: account_type
        tests:
          - not_null
          - accepted_values:
              values: ['Savings', 'Checking', 'Investment', 'Credit Card']

      - name: balance
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 1000000

      - name: interest_rate
        tests:
          - not_null

      - name: opened_date

      - name: account_status
        tests:
          - accepted_values:
              values: ['Active', 'Frozen', 'Closed']

      - name: account_age_months
        tests:
