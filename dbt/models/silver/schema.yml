version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: stg_raw_deduplicated
      - name: stg_accounts
      - name: stg_transactions
      - name: stg_loans

models:
  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: email
        tests:
          - unique
          - not_null
      - name: phone_number
        tests:
          - unique
          - not_null
      - name: date_of_birth
        tests:
          - not_null
      - name: gender
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'F', 'Other']
      - name: nationality
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']
      - name: lat
        tests:
          - not_null
      - name: lon
        tests:
          - not_null
      - name: registration_date
        tests:
          - not_null
      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['verified', 'pending', 'expired', 'rejected']
      - name: risk_score
        tests:
          - not_null
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']
      - name: relationship_manager
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive', 'suspended', 'closed']

  - name: silver_accounts
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: account_id
        tests:
          - not_null
          - unique
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              values: ['savings', 'checking', 'investment', 'credit_card']
      - name: currency
        tests:
          - not_null
      - name: balance
        tests:
          - not_null
      - name: credit_limit
        tests:
          - not_null
      - name: interest_rate
        tests:
          - not_null
      - name: opened_date
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'closed', 'frozen']
      - name: branch_code
        tests:
          - not_null

  - name: silver_transactions
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_accounts')
              field: account_id
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: type
        tests:
          - not_null
          - accepted_values:
              values: ['deposit', 'withdrawal', 'payment', 'transfer', 'refund', 'fee']
      - name: category
        tests:
          - not_null
      - name: merchant
        tests:
          - not_null
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'pos']
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'failed', 'reversed']

  - name: silver_loans
    columns:
      - name: customer_id
        tests:
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: type
        tests:
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']
      - name: status
        tests:
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']

  - name: silver_credit_info
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: credit_score
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: utilization_pct
        tests:
          - not_null
      - name: total_limit
        tests:
          - not_null
      - name: total_used
        tests:
          - not_null
      - name: num_credit_accounts
        tests:
          - not_null
      - name: oldest_account_age_months
        tests:
          - not_null
      - name: late_payments_12m
        tests:
          - not_null
      - name: inquiries_6m
        tests:
          - not_null
      - name: bankruptcy_flag
        tests:
          - not_null

  - name: silver_digital_engagement
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: mobile_app_registered
        tests:
          - not_null
      - name: web_banking_registered
        tests:
          - not_null
      - name: last_login_date
        tests:
          - not_null
      - name: avg_monthly_logins
        tests:
          - not_null
      - name: preferred_channel
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'branch', 'call_center']
      - name: push_notifications
        tests:
          - not_null
      - name: paperless_statements
        tests:
          - not_null