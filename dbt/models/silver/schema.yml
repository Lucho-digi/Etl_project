version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: stg_raw_deduplicated
      - name: stg_accounts
      - name: stg_transactions
      - name: stg_loans

models:
  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: email
      - name: date_of_birth
        tests:
          - not_null
      - name: gender
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'F', 'Other']
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']
      - name: lat
        tests:
          - value_in_range:
              min_value: -90
              max_value: 90
      - name: lon
        tests:
          - value_in_range:
              min_value: -180
              max_value: 180
      - name: registration_date
        tests:
          - not_null
      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['verified', 'pending', 'expired', 'rejected']
      - name: risk_score
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive', 'suspended', 'closed']
  - name: silver_accounts
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: account_id
        tests:
          - not_null
          - unique
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              values: ['savings', 'checking', 'investment', 'credit_card']
      - name: balance
        tests:
          - not_null
      - name: interest_rate
        tests:
          - not_null
      - name: opened_date
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'closed', 'frozen']

  - name: silver_transactions
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_accounts')
              field: account_id
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
          - value_in_range:
              min_value: 0
      - name: type
        tests:
          - not_null
          - accepted_values:
              values: ['deposit', 'withdrawal', 'transfer', 'payment', 'refund', 'fee']
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'pos']
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'failed', 'reversed']

  - name: silver_loans
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: loan_id
        tests:
          - not_null
          - unique
      - name: type
        tests:
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']
      - name: principal
        tests:
          - not_null
          - value_in_range:
              min_value: 0
      - name: interest_rate
        tests:
          - not_null
      - name: term_months
        tests:
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: end_date
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']
      - name: days_past_due
        tests:
          - value_in_range:
              min_value: 0
              max_value: 365
      - name: collateral_type
        tests:
          - accepted_values:
              values: ['none', 'real_estate', 'vehicle', 'investment_portfolio', 'savings_account']

  - name: silver_credit_info
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: utilization_pct
        tests:
          - not_null
          - value_in_range:
              min_value: 0
              max_value: 100
      - name: total_limit
        tests:
          - value_in_range:
              min_value: 0
      - name: total_used
        tests:
          - value_in_range:
              min_value: 0

  - name: silver_digital_engagement
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: last_login_date
      - name: preferred_channel
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'call_center']
