name: 'elt_platform'
version: '2.0.0'
config-version: 2

profile: 'elt_platform'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analysis"]
snapshot-paths: ["snapshots"]

target-path: "target"
log-path: "/tmp/dbt-logs"
clean-targets:
  - "target"
  - "dbt_packages"
  - "/tmp/dbt-logs"

models:
  elt_platform:
    # Bronze layer - raw JSON data staging
    bronze:
      +materialized: table
      +schema: bronze
    # Silver layer - cleaned and normalized data
    silver:
      +materialized: table
      +schema: silver
    # Gold layer - business-ready analytics
    gold:
      +materialized: table
      +schema: gold

seeds:
  elt_platform:
    +schema: raw
